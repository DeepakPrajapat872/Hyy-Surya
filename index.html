<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURYA AI</title>
<style>
body{background:#020b14;color:#00f3ff;font-family:sans-serif;text-align:center;padding:15px}
.top{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #00f3ff44;padding-bottom:8px;margin-bottom:15px}
button{padding:10px 22px;border:none;border-radius:20px;background:#0099ff;color:#fff;font-weight:bold;cursor:pointer;margin:5px}
.kbtn{padding:4px 10px;font-size:11px;background:#06243b;border:1px solid #00f3ff}
#kbox{display:none;margin:10px auto;max-width:350px;background:#061c2e;padding:10px;border-radius:8px;border:1px solid #00f3ff}
input{width:90%;padding:8px;margin-bottom:8px;border-radius:5px;border:1px solid #00f3ff;background:#000;color:#fff}
.orb{width:90px;height:90px;margin:15px auto;border-radius:50%;background:radial-gradient(#fff,#00f3ff,#003380);box-shadow:0 0 25px #00f3ff}
.log{max-width:400px;margin:15px auto;text-align:left;background:#00f3ff11;padding:10px;border-radius:8px;font-size:12px;max-height:160px;overflow-y:auto}
</style>
</head>
<body>
<div class="top">
  <span id="clk">TIME: --:--</span>
  <button class="kbtn" onclick="toggleBox()">🔑 SET GEMINI KEY</button>
</div>

<div id="kbox">
  <input id="kin" placeholder="Gemini API Key paste karein...">
  <br>
  <button class="kbtn" onclick="saveKey()">Save Key</button>
  <button class="kbtn" onclick="toggleBox()">Close</button>
</div>

<div class="orb"></div>
<h2>SURYA AI</h2>
<p id="st">Tap ACTIVATE to start</p>
<button id="mbtn" onclick="toggleMic()">ACTIVATE</button>

<div class="log" id="lg"><div>[SURYA] System Ready.</div></div>

<script>
let key = localStorage.getItem('s_key') || '';
let on = false, speaking = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = SR ? new SR() : null;

setInterval(()=>{ document.getElementById('clk').innerText = "TIME: " + new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }, 1000);

function log(m){ document.getElementById('lg').innerHTML = "<div>"+m+"</div>" + document.getElementById('lg').innerHTML; }
function toggleBox(){ const b=document.getElementById('kbox'); b.style.display = b.style.display==='block'?'none':'block'; document.getElementById('kin').value=key; }
function saveKey(){ key=document.getElementById('kin').value.trim(); localStorage.setItem('s_key',key); toggleBox(); log("[KEY] Gemini Key Saved!"); }

function say(t, hi, cb){
  document.getElementById('st').innerText = "Surya: " + t;
  speechSynthesis.cancel(); speaking = true;
  if(rec) try{rec.abort();}catch(e){}
  const u = new SpeechSynthesisUtterance(t);
  u.lang = hi ? 'hi-IN' : 'en-IN';
  u.onend = ()=>{ speaking=false; if(cb) cb(); else if(on) try{rec.start();}catch(e){} };
  speechSynthesis.speak(u);
}

async function ask(q){
  const hi = /[\u0900-\u097F]|\b(kya|kaun|kab|kaise|kholo|batao|hai|kitna)\b/i.test(q);
  log("[YOU] " + q);

  if(q.includes('youtube')||q.includes('यूट्यूब')){ say(hi?"यूट्यूब खोल रहा हूँ":"Opening YouTube",hi,()=>location.href="https://youtube.com"); return; }
  if(q.includes('whatsapp')||q.includes('व्हाट्सएप')){ say(hi?"व्हाट्सएप खोल रहा हूँ":"Opening WhatsApp",hi,()=>location.href="https://wa.me/"); return; }
  if(q.includes('instagram')||q.includes('इंस्टाग्राम')){ say(hi?"इंस्टाग्राम खोल रहा हूँ":"Opening Instagram",hi,()=>location.href="https://instagram.com"); return; }

  if(key){
    try{
      const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+key,{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({contents:[{parts:[{text:"Reply briefly in "+(hi?"Hindi":"English")+" without symbols: "+q}]}]})
      });
      if(r.ok){
        const d = await r.json();
        const ans = d.candidates[0].content.parts[0].text;
        log("[GEMINI] " + ans); say(ans, hi); return;
      }
      log("[AUTO-SWITCH] Gemini limit hit, shifting to Wikipedia...");
    }catch(e){}
  }

  try{
    const sub = hi ? 'hi' : 'en';
    const w = await fetch("https://"+sub+".wikipedia.org/w/api.php?action=query&list=search&srsearch="+encodeURIComponent(q)+"&format=json&origin=*").then(x=>x.json());
    const title = w.query.search[0].title;
    const s = await fetch("https://"+sub+".wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(title)).then(x=>x.json());
    log("[WIKIPEDIA] " + s.extract); say(s.extract.split('.')[0], hi);
  }catch(e){
    say(hi?"गूगल पर खोज रहा हूँ":"Searching Google",hi,()=>location.href="https://google.com/search?q="+encodeURIComponent(q));
  }
}

if(rec){
  rec.lang = 'hi-IN';
  rec.onresult = e => ask(e.results[0][0].transcript.toLowerCase());
  rec.onend = () => { if(on && !speaking) try{rec.start();}catch(e){} };
}

function toggleMic(){
  if(!rec) return alert("Use Chrome");
  on = !on;
  document.getElementById('mbtn').innerText = on ? "STOP" : "ACTIVATE";
  if(on){ log("[MIC] Listening..."); rec.start(); } else { rec.abort(); speaking=false; speechSynthesis.cancel(); }
}
</script>
</body>
</html>
