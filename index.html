<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SURYA AI" />
  <title>SURYA AI</title>
  <link id="appleIcon" rel="apple-touch-icon" sizes="180x180" />
  <link id="pwaManifest" rel="manifest" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;min-height:100dvh;overflow-x:hidden;background:#020b14;font-size:17px}
    body{
      background:radial-gradient(circle at 50% 15%,#104a75 0%,#020b14 58%,#010509 100%);
      color:#00f3ff;font-family:'Segoe UI',sans-serif;
      display:flex;flex-direction:column;justify-content:flex-start;align-items:center;
      padding:10px 14px 14px;gap:8px;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .hud-top{
      width:100%;display:flex;justify-content:space-between;align-items:center;
      font-size:13px;font-weight:700;color:#a5f1ff;white-space:nowrap;
      border-bottom:1.5px solid rgba(0,243,255,.3);padding-bottom:8px;gap:6px;
      flex-shrink:0;animation:fadeUp .3s ease both;
    }
    .badge-group{display:flex;align-items:center;gap:5px;flex-shrink:0}
    .engine-badge,.mute-btn{
      border-radius:12px;font-size:10.5px;font-weight:800;padding:4px 9px;white-space:nowrap;cursor:pointer;
    }
    .engine-badge{border:1.5px solid rgba(253,224,71,.85);color:#fde047;background:rgba(253,224,71,.15)}
    .mute-btn{border:1.5px solid rgba(56,189,248,.75);color:#e0f2fe;background:rgba(56,189,248,.18)}
    .center-stage{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;margin-top:1px}
    .orb-container{
      position:relative;width:156px;height:156px;display:flex;align-items:center;justify-content:center;
      cursor:pointer;animation:fadeUp .4s ease both;
    }
    .holo-halo{
      position:absolute;width:154px;height:154px;border-radius:50%;
      background:radial-gradient(circle,rgba(0,243,255,.22) 0%,transparent 70%);
      animation:haloPulse 2.6s ease-in-out infinite alternate;
    }
    .orbit-1{
      position:absolute;width:146px;height:146px;border-radius:50%;
      border:3px dashed rgba(0,243,255,.88);animation:spinR 9s linear infinite;
    }
    .orbit-2{
      position:absolute;width:116px;height:116px;border-radius:50%;
      border:3.5px solid transparent;border-left-color:#38bdf8;border-right-color:#00f3ff;
      animation:spinL 3.6s linear infinite;
    }
    .cyber-sphere{
      width:76px;height:76px;border-radius:50%;position:relative;overflow:hidden;
      display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 32% 28%,#ffffff,#38e8ff 46%,#004c99 92%);
      box-shadow:0 0 38px rgba(0,243,255,.95),inset 0 0 16px rgba(255,255,255,.9);
      animation:idleB 2.4s ease-in-out infinite alternate;transition:all .3s ease;
    }
    .holo-visor{display:flex;align-items:center;gap:12px;z-index:2}
    .holo-eye{
      width:11px;height:15px;border-radius:6px;background:#011829;
      box-shadow:0 0 8px #ffffff;animation:blinkEye 4.2s infinite;
    }
    @keyframes blinkEye{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.15)}}
    @keyframes haloPulse{from{transform:scale(.92);opacity:.7}to{transform:scale(1.08);opacity:1}}
    .listening .orbit-1{border-color:#00ff9d;animation-duration:2.2s}
    .listening .cyber-sphere{
      background:radial-gradient(circle at 32% 28%,#ffffff,#00ff9d 46%,#006633 92%);
      box-shadow:0 0 48px rgba(0,255,157,.95),inset 0 0 16px #fff;animation:actP .6s ease-in-out infinite alternate;
    }
    .thinking .orbit-1{border-color:#fde047;animation-duration:1.4s}
    .thinking .cyber-sphere{
      background:radial-gradient(circle at 32% 28%,#ffffff,#fde047 46%,#854d0e 92%);
      box-shadow:0 0 48px rgba(253,224,71,.95),inset 0 0 16px #fff;
    }
    .speaking .orbit-1{border-color:#c084fc;animation-duration:1.8s}
    .speaking .cyber-sphere{
      background:radial-gradient(circle at 32% 28%,#ffffff,#c084fc 46%,#4c1d95 92%);
      box-shadow:0 0 52px rgba(192,132,252,.95),inset 0 0 16px #fff;animation:spkB .32s ease-in-out infinite alternate;
    }
    @keyframes spinR{100%{transform:rotate(360deg)}}
    @keyframes spinL{100%{transform:rotate(-360deg)}}
    @keyframes idleB{from{transform:scale(.95)}to{transform:scale(1.05)}}
    @keyframes actP{from{transform:scale(.93)}to{transform:scale(1.13)}}
    @keyframes spkB{from{transform:scale(.96)}to{transform:scale(1.18)}}
    .title-row{display:flex;align-items:center;gap:8px}
    h1{font-size:33px;font-weight:900;letter-spacing:3px;color:#fff;text-shadow:0 0 20px rgba(0,243,255,.72)}
    .state-pill{
      font-size:10.5px;font-weight:800;letter-spacing:1px;padding:3px 9px;border-radius:10px;
      background:rgba(0,243,255,.14);border:1px solid rgba(0,243,255,.45);color:#67e8f9;
    }
    #status{font-size:15px;color:#c7f1ff;text-align:center;width:100%;min-height:22px;line-height:1.32;padding:0 4px;font-weight:500}
    .main-btn{
      padding:12px 50px;font-size:17px;font-weight:800;letter-spacing:2px;
      background:linear-gradient(90deg,#189bff,#0066ff);color:#fff;border:none;
      border-radius:32px;box-shadow:0 6px 26px rgba(0,153,255,.55);cursor:pointer;
    }
    .main-btn:active{transform:scale(.96)}
    .main-btn.active-stop{background:linear-gradient(90deg,#ff416c,#ff4b2b)}
    .quick-chips{width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;flex-shrink:0}
    .chip{
      background:rgba(12,42,68,.72);border:1.5px solid rgba(125,211,252,.44);
      color:#e6f9ff;padding:7px 11px;border-radius:13px;font-size:12.5px;font-weight:600;cursor:pointer;
    }
    .chip:active{transform:scale(.95)}
    .log-panel{
      width:100%;height:148px;
      background:linear-gradient(180deg,rgba(13,44,72,.66) 0%,rgba(5,19,34,.88) 100%);
      border:1.5px solid rgba(125,211,252,.38);border-radius:18px;
      padding:10px 13px;font-size:13px;overflow:hidden;
      display:flex;flex-direction:column;flex-shrink:0;
    }
    .log-header{
      display:flex;justify-content:space-between;align-items:center;
      border-bottom:1px solid rgba(125,211,252,.25);padding-bottom:6px;margin-bottom:6px;flex-shrink:0;
    }
    .log-title{font-weight:800;color:#e6f9ff;font-size:11px;letter-spacing:.4px}
    .log-actions{display:flex;gap:6px}
    .mini-act-btn{
      background:rgba(30,90,140,.62);border:1px solid rgba(125,211,252,.38);
      color:#dff6ff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;cursor:pointer;
    }
    #logList{flex:1;overflow-y:auto}
    .log-entry{margin-bottom:6px;line-height:1.4;color:#daf6ff}
    .log-source{color:#67e8f9;font-weight:bold}
    .log-entry a{color:#38bdf8;text-decoration:underline}
    .chat-bar{
      width:100%;display:flex;align-items:center;gap:9px;flex-shrink:0;
      background:rgba(10,34,58,.88);border:1.5px solid rgba(125,211,252,.45);
      border-radius:32px;padding:8px 10px 8px 16px;
    }
    .chat-input{flex:1;background:transparent;border:none;outline:none;color:#ffffff;font-size:16px;min-width:0}
    .chat-input::placeholder{color:#9ec4d8}
    .icon-btn{
      width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;
      display:flex;align-items:center;justify-content:center;font-size:18.5px;flex-shrink:0;
    }
    .mic-mini{background:rgba(56,189,248,.24);color:#e0f7ff;border:1.5px solid rgba(125,211,252,.45)}
    .send-mini{background:linear-gradient(135deg,#22b8ff,#0066ff);color:#fff}
  </style>
</head>
<body>
  <div class="hud-top">
    <span id="clock">TIME: --:--</span>
    <span id="battery">PWR: --%</span>
    <div class="badge-group">
      <button id="muteBtn" class="mute-btn" type="button">🔊 VOICE ON</button>
      <span class="engine-badge" id="timerBadge">AI CORE v3</span>
    </div>
  </div>
  <div class="center-stage">
    <div class="orb-container" id="orbLogo">
      <div class="holo-halo"></div>
      <div class="orbit-1"></div>
      <div class="orbit-2"></div>
      <div class="cyber-sphere">
        <div class="holo-visor"><span class="holo-eye"></span><span class="holo-eye"></span></div>
      </div>
    </div>
    <div class="title-row">
      <h1>SURYA</h1>
      <span class="state-pill" id="statePill">STANDBY</span>
    </div>
    <div id="status">Tap ACTIVATE for Voice Assistant</div>
    <button id="toggleBtn" class="main-btn" type="button">ACTIVATE</button>
  </div>
  <div class="quick-chips">
    <button class="chip" type="button" data-cmd="hello surya">👋 Hello</button>
    <button class="chip" type="button" data-cmd="what do you remember">🧠 Memory</button>
    <button class="chip" type="button" data-cmd="set timer 1 minute">⏱️ 1m Timer</button>
    <button class="chip" type="button" data-cmd="100 km to miles">📏 Convert</button>
    <button class="chip" type="button" data-cmd="open youtube">▶️ YouTube</button>
  </div>
  <div class="log-panel">
    <div class="log-header">
      <div class="log-title">SURYA NEURAL LOG + MEMORY</div>
      <div class="log-actions">
        <button id="exportBtn" class="mini-act-btn" type="button">Backup</button>
        <button id="clearLogBtn" class="mini-act-btn" type="button">Clear</button>
      </div>
    </div>
    <div id="logList"></div>
  </div>
  <form class="chat-bar" id="chatForm">
    <input class="chat-input" id="chatInput" type="text" placeholder="Ask Surya or type 'Learn: Q = A'..." autocomplete="off" />
    <button class="icon-btn mic-mini" id="miniMicBtn" type="button" title="Voice Input">🎙️</button>
    <button class="icon-btn send-mini" type="submit" title="Send">➤</button>
  </form>

  <script>
    const LOG_KEY='surya_saved_logs_v2',NOTES_KEY='surya_saved_notes_v2',LANG_KEY='surya_lang_pref_v1',NAME_KEY='surya_user_name_v1',QA_KEY='surya_custom_qa_v1';
    function makeIcon(sz){
      try{
        const c=document.createElement('canvas');c.width=sz;c.height=sz;
        const x=c.getContext('2d');if(!x)return '';
        x.fillStyle='#020b14';x.fillRect(0,0,sz,sz);
        const r=sz/2;
        x.strokeStyle='#38bdf8';x.lineWidth=Math.max(4,sz*.032);x.setLineDash([sz*.12,sz*.05]);
        x.beginPath();x.arc(r,r,sz*.36,0,Math.PI*2);x.stroke();x.setLineDash([]);
        x.strokeStyle='#00f3ff';x.lineWidth=Math.max(3,sz*.024);
        x.beginPath();x.arc(r,r,sz*.27,.4,Math.PI*1.65);x.stroke();
        const g=x.createRadialGradient(r-sz*.05,r-sz*.05,sz*.02,r,r,sz*.19);
        g.addColorStop(0,'#ffffff');g.addColorStop(.5,'#22d3ee');g.addColorStop(1,'#0284c7');
        x.fillStyle=g;x.beginPath();x.arc(r,r,sz*.19,0,Math.PI*2);x.fill();
        return c.toDataURL('image/png');
      }catch(e){return '';}
    }
    (function(){
      const i192=makeIcon(192),i512=makeIcon(512);
      const a=document.getElementById('appleIcon');if(a&&i192)a.href=i192;
      const icons=[];
      if(i192)icons.push({src:i192,sizes:'192x192',type:'image/png'});
      if(i512)icons.push({src:i512,sizes:'512x512',type:'image/png'});
      const m=document.getElementById('pwaManifest');
      if(m)m.href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify({name:'SURYA AI',short_name:'SURYA AI',start_url:'./',scope:'./',display:'standalone',background_color:'#020b14',theme_color:'#020b14',icons:icons}));
    })();

    const statusEl=document.getElementById('status'),toggleBtn=document.getElementById('toggleBtn'),logList=document.getElementById('logList'),orbLogo=document.getElementById('orbLogo'),statePill=document.getElementById('statePill'),muteBtn=document.getElementById('muteBtn'),clearLogBtn=document.getElementById('clearLogBtn'),exportBtn=document.getElementById('exportBtn'),timerBadge=document.getElementById('timerBadge'),chatForm=document.getElementById('chatForm'),chatInput=document.getElementById('chatInput'),miniMicBtn=document.getElementById('miniMicBtn');
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    let isListening=false,isSpeaking=false,isMuted=false,rec=null,timerInterval=null;
    let preferredLang=(function(){try{return localStorage.getItem(LANG_KEY)||'en';}catch(e){return 'en';}})();

    function detectLang(text){
      const t=(text||'').trim().toLowerCase();
      if(/[\u0900-\u097F]/.test(t))return 'hi';
      if(/\b(hindi|hindi mein|hinglish|kya|kaun|kab|kaha|kaise|kholo|karo|chalao|batao|mera|meri|tum|aap|hai|hain|tha|thi|kitna|kitne|sunao|lagao|bhejo|kyun|aaj|samay|waqt|din|tarik|tarikh|baat|yaad|sikho)\b/i.test(t)){
        return 'hi';
      }
      if(/\b(speak in english|english mein|in english)\b/i.test(t))return 'en';
      return preferredLang||'en';
    }
    function setPreferredLang(lang){
      preferredLang=lang==='hi'?'hi':'en';
      try{localStorage.setItem(LANG_KEY,preferredLang);}catch(e){}
      if(rec)rec.lang=preferredLang==='hi'?'hi-IN':'en-IN';
    }
    function renderLogItem(item){
      const d=document.createElement('div');d.className='log-entry';
      d.innerHTML='<span class="log-source">['+item.src+']</span> '+item.det+(item.url?' — <a href="'+item.url+'" target="_blank">Open</a>':'');
      logList.prepend(d);
    }
    function addLog(src,det,url=null,persist=true){
      const entry={src:src,det:det,url:url};
      renderLogItem(entry);
      if(persist){
        try{
          const list=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
          list.push(entry);
          localStorage.setItem(LOG_KEY,JSON.stringify(list.slice(-45)));
        }catch(e){}
      }
    }
    (function loadSavedLogs(){
      try{
        const list=JSON.parse(localStorage.getItem(LOG_KEY)||'[]');
        if(list.length){list.forEach(function(item){renderLogItem(item);});}
        else{addLog('SURYA','Neural Core v3 Online. Say "Learn: Q = A" to train me!',null,false);}
      }catch(e){addLog('SURYA','Neural Core v3 Online.',null,false);}
    })();

    function setVis(st){
      orbLogo.classList.remove('listening','speaking','thinking');
      if(st==='listening'){orbLogo.classList.add('listening');statePill.innerText='LISTENING';}
      else if(st==='speaking'){orbLogo.classList.add('speaking');statePill.innerText='SPEAKING';}
      else if(st==='thinking'){orbLogo.classList.add('thinking');statePill.innerText='THINKING';}
      else{statePill.innerText=isListening?'READY':'STANDBY';}
    }
    function updClock(){const n=new Date();document.getElementById('clock').innerText='TIME: '+n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}
    updClock();setInterval(updClock,1000);
    if(navigator.getBattery)navigator.getBattery().then(function(b){const f=function(){document.getElementById('battery').innerText='PWR: '+Math.round(b.level*100)+'%';};f();b.addEventListener('levelchange',f);});

    muteBtn.addEventListener('click',function(){isMuted=!isMuted;muteBtn.innerText=isMuted?'🔇 MUTED':'🔊 VOICE ON';if(isMuted){window.speechSynthesis.cancel();isSpeaking=false;setVis(isListening?'listening':'idle');}addLog('SYSTEM',isMuted?'Voice output muted.':'Voice output enabled.');});
    clearLogBtn.addEventListener('click',function(){try{localStorage.removeItem(LOG_KEY);}catch(e){}logList.innerHTML='';addLog('SURYA','Logs cleared.',null,false);});
    exportBtn.addEventListener('click',function(){
      try{
        const data={
          name:localStorage.getItem(NAME_KEY)||'',
          notes:JSON.parse(localStorage.getItem(NOTES_KEY)||'[]'),
          customQA:JSON.parse(localStorage.getItem(QA_KEY)||'{}'),
          logs:JSON.parse(localStorage.getItem(LOG_KEY)||'[]')
        };
        const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const a=document.createElement('a');
        a.href=URL.createObjectURL(blob);
        a.download='surya-ai-backup.json';
        a.click();
        addLog('BACKUP','Exported surya-ai-backup.json (Ready to upload to TeraBox/Drive)');
      }catch(e){}
    });
        function pickVoice(lang){
      const voices=window.speechSynthesis.getVoices()||[];
      if(lang==='hi')return voices.find(function(v){return /hi(-|_)?in/i.test(v.lang);})||voices.find(function(v){return /^hi/i.test(v.lang);})||null;
      return voices.find(function(v){return /en(-|_)?in/i.test(v.lang);})||voices.find(function(v){return /^en/i.test(v.lang);})||null;
    }
    function speak(text,lang='en',cb=null){
      const clean=text.replace(/[*#_`]/g,'');statusEl.innerText='Surya: '+clean;window.speechSynthesis.cancel();
      if(rec)try{rec.abort();}catch(e){}
      if(isMuted){isSpeaking=false;setVis('idle');if(cb)cb();else if(isListening)setTimeout(function(){if(isListening&&!isSpeaking&&rec)try{rec.start();}catch(e){}},300);return;}
      isSpeaking=true;
      const u=new SpeechSynthesisUtterance(clean);
      u.lang=lang==='hi'?'hi-IN':'en-IN';
      const v=pickVoice(lang);if(v)u.voice=v;
      u.rate=1.0;u.pitch=1.0;
      u.onstart=function(){setVis('speaking');};
      u.onend=u.onerror=function(){isSpeaking=false;setVis('idle');if(cb)cb();else if(isListening)setTimeout(function(){if(isListening&&!isSpeaking&&rec)try{rec.start();}catch(e){}},350);};
      window.speechSynthesis.speak(u);
    }
    function openAppSmart(app){
      const isAndroid=/Android/i.test(navigator.userAgent);
      if(isAndroid&&app.pkg){
        let intentUrl='';
        if(app.pkg==='com.whatsapp'||app.pkg==='com.whatsapp.w4b'){
          const sc=app.pkg==='com.whatsapp.w4b'?'whatsapp':'whatsapp';
          intentUrl='intent://send/#Intent;scheme='+sc+';package='+app.pkg+';S.browser_fallback_url='+encodeURIComponent(app.url||'https://wa.me/')+';end';
        }else if(app.directIntent){
          intentUrl='intent://#Intent;package='+app.pkg+';end';
        }else{
          const hostPath=(app.url||'https://www.google.com/').replace(/^https?:\/\//,'');
          intentUrl='intent://'+hostPath+'#Intent;scheme=https;package='+app.pkg+';S.browser_fallback_url='+encodeURIComponent(app.url)+';end';
        }
        const wasHidden=document.hidden;
        window.location.href=intentUrl;
        if(app.url&&!app.directIntent){
          setTimeout(function(){if(!document.hidden&&!wasHidden)window.location.href=app.url;},1300);
        }
        return;
      }
      if(app.url)window.location.href=app.url;
    }
    function tryLangSwitch(cmd){
      const c=cmd.trim().toLowerCase();
      if(/\b(hindi mein baat karo|speak in hindi|hindi me bolo|talk in hindi|hindi)\b/i.test(c)||/हिन्दी में बात|हिंदी में बात/.test(cmd)){
        setPreferredLang('hi');
        const r='बिलकुल! अब मैं आपसे हिंदी में बात करूँगा। बताइए, मैं आपकी क्या मदद कर सकता हूँ?';
        addLog('SURYA (HI)',r);speak(r,'hi');return true;
      }
      if(/\b(speak in english|english mein baat karo|talk in english|english)\b/i.test(c)){
        setPreferredLang('en');
        const r='Sure! Switched back to English. How can I help you?';
        addLog('SURYA (EN)',r);speak(r,'en');return true;
      }
      return false;
    }
    function tryCustomQA(cmd,lang){
      const learnM=cmd.match(/^(?:learn|teach|sikho)\s*:?\s*(.+?)\s*(?:=|->|means|ka jawab)\s*(.+)/i);
      if(learnM){
        const qKey=learnM[1].trim().toLowerCase().replace(/[?!.]/g,'');
        const ansVal=learnM[2].trim();
        try{
          const qa=JSON.parse(localStorage.getItem(QA_KEY)||'{}');
          qa[qKey]=ansVal;
          localStorage.setItem(QA_KEY,JSON.stringify(qa));
        }catch(e){}
        const r=lang==='hi'?'सीख लिया! जब आप "'+qKey+'" पूछेंगे, तो मैं "'+ansVal+'" जवाब दूँगा।':'Learned! When you ask "'+qKey+'", I will reply: "'+ansVal+'".';
        addLog('TRAINED Q&A',qKey+' -> '+ansVal);speak(r,lang);return true;
      }
      try{
        const qa=JSON.parse(localStorage.getItem(QA_KEY)||'{}');
        const cleanQ=cmd.trim().toLowerCase().replace(/[?!।.]/g,'');
        if(qa[cleanQ]){
          addLog('CUSTOM MEMORY',qa[cleanQ]);speak(qa[cleanQ],lang);return true;
        }
      }catch(e){}
      return false;
    }
    function tryTimerAndConvert(cmd,lang){
      const tM=cmd.match(/(?:set timer|timer|alarm)\s+(?:for\s+)?(\d+)\s*(second|seconds|sec|minute|minutes|min|मिनट|सेकंड)/i);
      if(tM){
        const val=parseInt(tM[1],10);
        const isMin=/min|मिनट/i.test(tM[2]);
        let secs=isMin?val*60:val;
        if(timerInterval)clearInterval(timerInterval);
        addLog('TIMER','Started for '+val+' '+tM[2]);
        speak(lang==='hi'?val+' '+tM[2]+' का टाइमर शुरू कर दिया है।':'Timer set for '+val+' '+tM[2]+'.',lang);
        timerInterval=setInterval(function(){
          secs--;
          const m=Math.floor(secs/60),s=secs%60;
          timerBadge.innerText='⏱️ '+m+':'+(s<10?'0'+s:s);
          if(secs<=0){

        function tryAdvMath(cmd){
      let s=cmd.toLowerCase();
      const pct=s.match(/(\d+(?:\.\d+)?)\s*(?:%|percent)\s*of\s*(\d+(?:\.\d+)?)/i);
      if(pct){const v=(parseFloat(pct[1])/100)*parseFloat(pct[2]);return Number.isInteger(v)?v:parseFloat(v.toFixed(4));}
      s=s.replace(/\b(sin|cos|tan)\s*\(?\s*(-?\d+(?:\.\d+)?)\s*\)?/gi,function(_,fn,deg){const rad=(parseFloat(deg)*Math.PI)/180;let r=fn.toLowerCase()==='sin'?Math.sin(rad):fn.toLowerCase()==='cos'?Math.cos(rad):Math.tan(rad);return '('+Number(r.toFixed(6))+')';});
      s=s.replace(/(?:square root of|sqrt|वर्गमूल)\s*\(?\s*(\d+(?:\.\d+)?)\s*\)?/gi,function(_,n){return 'Math.sqrt('+parseFloat(n)+')';});
      s=s.replace(/(?:cube root of|cbrt|घनमूल)\s*\(?\s*(\d+(?:\.\d+)?)\s*\)?/gi,function(_,n){return 'Math.cbrt('+parseFloat(n)+')';});
      s=s.replace(/\blog10\s*\(?\s*(\d+(?:\.\d+)?)\s*\)?/gi,function(_,n){return 'Math.log10('+parseFloat(n)+')';});
      s=s.replace(/\b(log|ln)\s*\(?\s*(\d+(?:\.\d+)?)\s*\)?/gi,function(_,__,n){return 'Math.log('+parseFloat(n)+')';});
      s=s.replace(/\b(pi|पाई)\b/gi,'('+Math.PI+')');
      s=s.replace(/(\d+(?:\.\d+)?)\s*(?:to the power(?: of)?|power|\^|की घात)\s*(\d+(?:\.\d+)?)/gi,function(_,b,e){return 'Math.pow('+parseFloat(b)+','+parseFloat(e)+')';});
      s=s.replace(/into|multiplied by|multiply|x|×|गुणा/gi,'*').replace(/plus|add|added to|जोड़/gi,'+').replace(/minus|subtract|घटा/gi,'-').replace(/divided by|divide by|भाग/gi,'/').replace(/[^0-9+\-*/().Mathpowsqrtcbrtlog10a-zA-Z]/g,' ').replace(/\s+/g,' ').trim();
      if(/[0-9]/.test(s)&&/(\+|-|\*|\/|Math\.)/.test(s)){
        try{const ans=Function('"use strict";return ('+s+')')();if(typeof ans==='number'&&!isNaN(ans)&&isFinite(ans))return Number.isInteger(ans)?ans:parseFloat(ans.toFixed(4));}catch(e){}
      }
      return null;
    }

    if(SR){
      rec=new SR();rec.lang=preferredLang==='hi'?'hi-IN':'en-IN';rec.continuous=false;rec.interimResults=false;
      rec.onstart=function(){if(isSpeaking){try{rec.abort();}catch(e){}return;}setVis('listening');statusEl.innerText=preferredLang==='hi'?'सुन रहा हूँ...':'Listening...';};
      rec.onresult=function(e){if(isSpeaking)return;const c=e.results[0][0].transcript;statusEl.innerText='You: '+c;processCmd(c);};
      rec.onend=function(){if(!isSpeaking)setVis('idle');if(isListening&&!isSpeaking)setTimeout(function(){if(isListening&&!isSpeaking)try{rec.start();}catch(e){}},350);};
      rec.onerror=function(){if(!isSpeaking)setVis('idle');if(isListening&&!isSpeaking)setTimeout(function(){if(isListening&&!isSpeaking)try{rec.start();}catch(e){}},600);};
    }

    function toggleSurya(){
      if(!SR){statusEl.innerText='Please use Chrome browser.';return;}
      if(!isListening){
        isListening=true;toggleBtn.innerText='STOP';toggleBtn.classList.add('active-stop');addLog('SYSTEM','Surya Neural Core Active.');
        try{rec.start();}catch(e){statusEl.innerText='Please allow microphone permission.';}
      }else{
        isListening=false;isSpeaking=false;window.speechSynthesis.cancel();toggleBtn.innerText='ACTIVATE';toggleBtn.classList.remove('active-stop');setVis('idle');
        try{rec.abort();}catch(e){}addLog('SYSTEM','Standby.');statusEl.innerText='Surya on standby. Tap ACTIVATE to resume.';
      }
    }

    toggleBtn.addEventListener('click',toggleSurya);
    orbLogo.addEventListener('click',toggleSurya);
    miniMicBtn.addEventListener('click',function(){if(!SR){statusEl.innerText='Please use Chrome browser.';return;}if(!isListening)toggleSurya();else try{rec.start();}catch(e){}});
  </script>
</body>
</html>
