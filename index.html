<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>SURYA AI</title>

  <!-- Custom Cyber Orb App Icon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23020b14'/%3E%3Ccircle cx='256' cy='256' r='175' fill='none' stroke='%2300f3ff' stroke-width='20' stroke-dasharray='80 30'/%3E%3Ccircle cx='256' cy='256' r='115' fill='%2306243b' stroke='%2338bdf8' stroke-width='12'/%3E%3Ccircle cx='256' cy='256' r='55' fill='%2300f3ff'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%23020b14'/%3E%3Ccircle cx='256' cy='256' r='175' fill='none' stroke='%2300f3ff' stroke-width='20' stroke-dasharray='80 30'/%3E%3Ccircle cx='256' cy='256' r='115' fill='%2306243b' stroke='%2338bdf8' stroke-width='12'/%3E%3Ccircle cx='256' cy='256' r='55' fill='%2300f3ff'/%3E%3C/svg%3E" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #071e30 0%, #010509 100%);
      color: #00f3ff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 14px;
      gap: 10px;
    }
    .hud-top {
      width: 100%; max-width: 440px;
      display: flex; justify-content: space-between;
      font-size: 11px; color: #8be9fd;
      border-bottom: 1px solid rgba(0, 243, 255, 0.25);
      padding-bottom: 6px;
    }

    /* 3D Orbiting Cyber Orb Logo */
    .orb-container {
      position: relative;
      width: 130px; height: 130px;
      display: flex; align-items: center; justify-content: center;
      margin-top: 4px;
      cursor: pointer;
    }
    .orbit-1 {
      position: absolute; width: 126px; height: 126px;
      border-radius: 50%;
      border: 2.5px dashed #00f3ff;
      animation: spinRight 8s linear infinite;
    }
    .orbit-2 {
      position: absolute; width: 98px; height: 98px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-left-color: #38bdf8;
      border-right-color: #00f3ff;
      animation: spinLeft 3.5s linear infinite;
    }
    .cyber-sphere {
      width: 62px; height: 62px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #00f3ff 45%, #003380 90%);
      box-shadow: 0 0 25px #00f3ff, inset 0 0 12px #ffffff;
      animation: idleBreath 2.2s ease-in-out infinite alternate;
      transition: all 0.3s ease;
    }

    .listening .orbit-1 { border-color: #00ff9d; animation-duration: 2.5s; }
    .listening .orbit-2 { border-left-color: #00ff9d; border-right-color: #00ff9d; animation-duration: 1.5s; }
    .listening .cyber-sphere {
      background: radial-gradient(circle at 30% 30%, #ffffff, #00ff9d 45%, #006633 90%);
      box-shadow: 0 0 35px #00ff9d;
      animation: activePulse 0.6s infinite alternate;
    }

    .speaking .orbit-1 { border-color: #c084fc; animation-duration: 1.8s; }
    .speaking .orbit-2 { border-left-color: #e879f9; border-right-color: #38bdf8; animation-duration: 1s; }
    .speaking .cyber-sphere {
      background: radial-gradient(circle at 30% 30%, #ffffff, #c084fc 45%, #4c1d95 90%);
      box-shadow: 0 0 40px #c084fc;
      animation: speakBounce 0.35s infinite alternate;
    }

    @keyframes spinRight { 100% { transform: rotate(360deg); } }
    @keyframes spinLeft { 100% { transform: rotate(-360deg); } }
    @keyframes idleBreath { from { transform: scale(0.94); } to { transform: scale(1.04); } }
    @keyframes activePulse { from { transform: scale(0.92); } to { transform: scale(1.12); } }
    @keyframes speakBounce { from { transform: scale(0.95); } to { transform: scale(1.18); } }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 12px #00f3ff;
    }
    #status {
      font-size: 13px;
      color: #a5f3fc;
      text-align: center;
      max-width: 420px;
      min-height: 20px;
    }
    button {
      padding: 10px 32px;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #00c6ff, #0072ff);
      color: #ffffff;
      border: none;
      border-radius: 25px;
      box-shadow: 0 0 16px rgba(0, 198, 255, 0.5);
      cursor: pointer;
    }
    button.active-stop {
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      box-shadow: 0 0 16px rgba(255, 65, 108, 0.5);
    }

    .log-panel {
      width: 100%; max-width: 440px;
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11px;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 4px;
    }
    .log-title {
      font-weight: bold; color: #00f3ff;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      padding-bottom: 3px; margin-bottom: 5px;
      font-size: 10px; letter-spacing: 1px;
    }
    .log-entry { margin-bottom: 5px; line-height: 1.35; color: #cffafe; }
    .log-source { color: #fde047; font-weight: bold; }
    .log-entry a { color: #38bdf8; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="hud-top">
    <span id="clock">TIME: --:--</span>
    <span id="battery">PWR: --%</span>
    <span id="langHud">LANG: EN</span>
  </div>

  <!-- Cyber Orb Logo -->
  <div class="orb-container" id="orbLogo" onclick="toggleSurya()">
    <div class="orbit-1"></div>
    <div class="orbit-2"></div>
    <div class="cyber-sphere"></div>
  </div>

  <h1>SURYA</h1>
  <div id="status">Tap ACTIVATE once for hands-free mode</div>
  <button id="toggleBtn" onclick="toggleSurya()">ACTIVATE</button>

  <div class="log-panel">
    <div class="log-title">LIVE EXECUTION &amp; SOURCE LOG</div>
    <div id="logList">
      <div class="log-entry"><span class="log-source">[SYSTEM]</span> Ready. Say "Hindi mein baat karo" to switch to Hindi.</div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const toggleBtn = document.getElementById('toggleBtn');
    const logList = document.getElementById('logList');
    const orbLogo = document.getElementById('orbLogo');
    const langHud = document.getElementById('langHud');
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    let isListening = false;
    let isSpeaking = false;
    let currentLang = 'en'; // 'en' or 'hi'
    let recognition = null;

    function setVisualState(state) {
      orbLogo.classList.remove('listening', 'speaking');
      if (state === 'listening') orbLogo.classList.add('listening');
      if (state === 'speaking') orbLogo.classList.add('speaking');
    }

    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').innerText = "TIME: " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }, 1000);

    if (navigator.getBattery) {
      navigator.getBattery().then(b => {
        const updateBat = () => document.getElementById('battery').innerText = "PWR: " + Math.round(b.level * 100) + "%";
        updateBat();
        b.addEventListener('levelchange', updateBat);
      });
    }

    function addLog(source, detail, url = null) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      let linkHtml = url ? ` — <a href="${url}" target="_blank">Open Link</a>` : '';
      div.innerHTML = `<span class="log-source">[${source}]</span> ${detail}${linkHtml}`;
      logList.prepend(div);
    }

    function speak(text, callback = null) {
      statusEl.innerText = "Surya: " + text;
      window.speechSynthesis.cancel();
      isSpeaking = true;

      // Stop microphone while Surya speaks to prevent self-echo!
      if (recognition) {
        try { recognition.abort(); } catch (e) {}
      }

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = currentLang === 'hi' ? 'hi-IN' : 'en-IN';
      utter.rate = 0.98;
      utter.pitch = 0.95;

      utter.onstart = () => setVisualState('speaking');
      utter.onend = () => {
        isSpeaking = false;
        setVisualState('idle');
        if (callback) {
          callback();
        } else if (isListening) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              try { recognition.start(); } catch (e) {}
            }
          }, 400);
        }
      };
      utter.onerror = () => {
        isSpeaking = false;
        setVisualState('idle');
      };
      window.speechSynthesis.speak(utter);
    }

    async function searchWikipedia(rawQuery) {
      const topic = rawQuery
        .replace(/\b(who is|what is|tell me about|when was|born|died|ka janm kab hua tha|ko fansi kab hui thi|kaun hai|kaun the|kya hai|ke bare mein batao|in hindi|hindi mein)\b/gi, '')
        .replace(/(का जन्म कब हुआ था|को फांसी कब हुई थी|कौन है|कौन थे|क्या है|के बारे में बताओ)/g, '')
        .trim();

      if (!topic || topic.length < 2) return false;
      const wikiSub = currentLang === 'hi' ? 'hi' : 'en';
      addLog(`WIKIPEDIA (${wikiSub.toUpperCase()})`, `Searching: "${topic}"...`);

      try {
        const searchUrl = `https://${wikiSub}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(topic)}&format=json&origin=*`;
        const searchRes = await fetch(searchUrl);
        const searchData = await searchRes.json();
        const bestTitle = searchData?.query?.search?.[0]?.title;

        if (!bestTitle) return false;

        const summaryUrl = `https://${wikiSub}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(bestTitle)}`;
        const sumRes = await fetch(summaryUrl);
        const sumData = await sumRes.json();

        if (sumData.extract) {
          const splitChar = currentLang === 'hi' ? '। ' : '. ';
          const shortAns = sumData.extract.split(splitChar).slice(0, 2).join(splitChar) + (currentLang === 'hi' ? '।' : '.');
          addLog("WIKIPEDIA ANSWER", shortAns, sumData.content_urls?.desktop?.page);
          speak(shortAns);
          return true;
        }
      } catch (e) {
        return false;
      }
      return false;
    }

    async function processCommand(cmd) {
      if (isSpeaking) return;
      addLog("VOICE INPUT", `Heard: "${cmd}"`);

      // Switch to Hindi Mode
      if (cmd.includes('hindi mein') || cmd.includes('speak in hindi') || cmd.includes('hindi me baat') || cmd.includes('हिंदी में')) {
        currentLang = 'hi';
        langHud.innerText = "LANG: HI";
        if (recognition) recognition.lang = 'hi-IN';
        addLog("LANGUAGE", "Switched to Hindi (hi-IN)");
        speak("ठीक है सर, अब मैं आपसे हिंदी में बात करूँगा। बताइए मैं आपकी क्या सहायता कर सकता हूँ?");
        return;
      }

      // Switch to English Mode
      if (cmd.includes('speak in english') || cmd.includes('english mein') || cmd.includes('english me baat') || cmd.includes('अंग्रेजी में')) {
        currentLang = 'en';
        langHud.innerText = "LANG: EN";
        if (recognition) recognition.lang = 'en-IN';
        addLog("LANGUAGE", "Switched to English (en-IN)");
        speak("Alright sir, I have switched back to English mode.");
        return;
      }

      // Stop / Sleep command
      if (/\b(stop|sleep|band ho ja|रुक जाओ|बंद हो जाओ)\b/i.test(cmd)) {
        isListening = false;
        toggleBtn.innerText = "ACTIVATE";
        toggleBtn.classList.remove('active-stop');
        addLog("SYSTEM", "Continuous listening stopped.");
        speak(currentLang === 'hi' ? "ठीक है सर, मैं स्लीप मोड में जा रहा हूँ।" : "Going to sleep mode, sir.");
        return;
      }

      // Greeting check
      if (/^(hello|hi|hey|namaste|surya|hello surya|hi surya|नमस्ते|सूर्या)$/i.test(cmd.trim())) {
        addLog("LOCAL AI", "Greeting module triggered.");
        speak(currentLang === 'hi'
          ? "नमस्ते सर! सूर्या सिस्टम ऑनलाइन है। बताइए मैं आपकी क्या मदद कर सकता हूँ?"
          : "Hello sir! Surya system is online. How may I assist you?");
        return;
      }

      // Time & Date
      if (/\b(time|samay|kitne baje)\b/i.test(cmd) || cmd.includes('समय') || cmd.includes('कितने बजे')) {
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        addLog("DEVICE CLOCK", `Fetched time: ${time}`);
        speak(currentLang === 'hi' ? `सर, अभी समय हो रहा है ${time}` : `Sir, the current time is ${time}`);
        return;
      }
      if (/\b(date|tarikh|aaj kya din)\b/i.test(cmd) || cmd.includes('तारीख')) {
        const date = new Date().toDateString();
        addLog("DEVICE CALENDAR", `Fetched date: ${date}`);
        speak(currentLang === 'hi' ? `सर, आज की तारीख है ${date}` : `Today is ${date}`);
        return;
      }

      // Battery
      if (/\b(battery|charge)\b/i.test(cmd) || cmd.includes('बैटरी')) {
        const batText = document.getElementById('battery').innerText.replace('PWR: ', '');
        addLog("BATTERY SENSOR", `Read ${batText}`);
        speak(currentLang === 'hi' ? `सर, फोन की बैटरी ${batText} चार्ज है।` : `Sir, system battery is at ${batText}`);
        return;
      }

      // Math calculation
      const mathMatch = cmd.replace(/into|multiply|x|गुणा/gi, '*').replace(/plus|जोड़/gi, '+').replace(/minus|घटा/gi, '-').replace(/divide by|divided by|भाग/gi, '/');
      if (/^[0-9+\-*/().\s]+$/.test(mathMatch.trim()) && /[+\-*/]/.test(mathMatch)) {
        try {
          const ans = Function('"use strict";return (' + mathMatch + ')')();
          addLog("MATH ENGINE", `Calculated: ${mathMatch.trim()} = ${ans}`);
          speak(currentLang === 'hi' ? `इसका उत्तर है ${ans}` : `The answer is ${ans}`);
          return;
        } catch (e) {}
      }

      // Play song on YouTube
      if (/\b(play|chalao|song|gaana)\b/i.test(cmd) || cmd.includes('गाना') || cmd.includes('चलाओ')) {
        const song = cmd.replace(/play|on youtube|chalao|song|gaana|गाना|चलाओ/gi, '').trim();
        const ytUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(song)}`;
        addLog("YOUTUBE LAUNCHER", `Playing: "${song}"`, ytUrl);
        speak(currentLang === 'hi' ? `यूट्यूब पर ${song} चला रहा हूँ सर।` : `Opening YouTube for ${song}`, () => { window.location.href = ytUrl; });
        return;
      }

      // Open Apps
      if (cmd.includes('youtube') || cmd.includes('यूट्यूब')) {
        addLog("APP LAUNCHER", "Opening YouTube", "https://www.youtube.com");
        speak(currentLang === 'hi' ? "यूट्यूब खोल रहा हूँ सर।" : "Opening YouTube, sir.", () => { window.location.href = "https://www.youtube.com"; });
        return;
      }
      if (cmd.includes('whatsapp') || cmd.includes('व्हाट्सएप')) {
        addLog("APP LAUNCHER", "Opening WhatsApp", "https://wa.me/");
        speak(currentLang === 'hi' ? "व्हाट्सएप खोल रहा हूँ सर।" : "Opening WhatsApp, sir.", () => { window.location.href = "https://wa.me/"; });
        return;
      }
      if (cmd.includes('instagram') || cmd.includes('इंस्टाग्राम')) {
        addLog("APP LAUNCHER", "Opening Instagram", "https://www.instagram.com");
        speak(currentLang === 'hi' ? "इंस्टाग्राम खोल रहा हूँ सर।" : "Opening Instagram, sir.", () => { window.location.href = "https://www.instagram.com"; });
        return;
      }

      // Wikipedia Answer (Hindi or English depending on active mode)
      const wikiSuccess = await searchWikipedia(cmd);
      if (wikiSuccess) return;

      // Fallback Google Search
      const gUrl = `https://www.google.com/search?q=${encodeURIComponent(cmd)}`;
      addLog("GOOGLE SEARCH", `Searching: "${cmd}"`, gUrl);
      speak(currentLang === 'hi' ? `गूगल पर ${cmd} खोज रहा हूँ सर।` : `Searching Google for ${cmd}`, () => { window.location.href = gUrl; });
    }

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        if (isSpeaking) {
          try { recognition.abort(); } catch (e) {}
          return;
        }
        setVisualState('listening');
        statusEl.innerText = currentLang === 'hi' ? "सुन रहा हूँ..." : "Listening continuously...";
      };

      recognition.onresult = (event) => {
        if (isSpeaking) return;
        const cmd = event.results[0][0].transcript.toLowerCase();
        statusEl.innerText = "You: " + cmd;
        processCommand(cmd);
      };

      recognition.onend = () => {
        if (!isSpeaking) setVisualState('idle');
        if (isListening && !isSpeaking) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              try { recognition.start(); } catch (e) {}
            }
          }, 300);
        }
      };

      recognition.onerror = () => {
        if (!isSpeaking) setVisualState('idle');
        if (isListening && !isSpeaking) {
          setTimeout(() => {
            if (isListening && !isSpeaking) {
              try { recognition.start(); } catch (e) {}
            }
          }, 600);
        }
      };
    }

    function toggleSurya() {
      if (!SpeechRecognition) {
        statusEl.innerText = "Browser voice support nahi kar raha. Chrome use karein.";
        return;
      }
      if (!isListening) {
        isListening = true;
        toggleBtn.innerText = "STOP";
        toggleBtn.classList.add('active-stop');
        addLog("SYSTEM", "Hands-free continuous mode activated.");
        recognition.start();
      } else {
        isListening = false;
        isSpeaking = false;
        window.speechSynthesis.cancel();
        toggleBtn.innerText = "ACTIVATE";
        toggleBtn.classList.remove('active-stop');
        setVisualState('idle');
        try { recognition.abort(); } catch (e) {}
        addLog("SYSTEM", "System paused.");
        statusEl.innerText = "Surya paused. Tap ACTIVATE to resume.";
      }
    }
  </script>
</body>
</html>
